<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles/general_style.css">
  <link rel="stylesheet" href="styles/nav_style.css">
  <link rel="stylesheet" href="styles/content_area_style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="dash-board">
    <nav>
    <div class="logo-div">
      <img src="icons/logo.png" alt="">
    </div>
    <div class="menu-div">
      <h2>MENU</h2>
      <div>
        <button class="active"></button>
      </div>
    </div>

    <div class="menu-div">
      <h2>HELP & SUPPORT</h2>
      <div>
        <button>Users Guide</button>
        <button>FAQ</button>
        <button>Contact Support</button>
        <button>Settings</button>
      </div>

     
    </div>
     <div class="profile-div">
        <div>
          <div>
          <img src="icons/pfp.jpg" alt="">
          </div>
          <div>
            <p  id="user-name"></p>
            <p id="user-email"></p>
          </div>
        </div>
        
        <div>
          <img id="logout-icon" src="icons/logout.png" alt="">
        </div>
      </div>

   
    </nav>
    <div class="content-area">
      <span class="go-back-div">
        <!-- <button class="go-back">Go back</button> -->
      </span>
   
      <div id="content-header">
        <h1></h1>
        <div id="btn-div">
        
        </div>
      </div>
      <div id="table-div">
        <div>
          <h2></h2>
          <div class="wrapper" id="search-bar">
            <img src="icons/magnifyer.svg" alt="">
            <input type="text" placeholder="">
          </div>
          
        </div>
        
        <table>
        </table>
      </div>
    </div>

    <dialog id="user-modal">
        <div id="user-close-modal" class="close-modal">X</div>
        <h1>Admin Panel: Add User</h1>
        <h2>Use this form to register a new user in the system.</h2>
        <div class="input-div">
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username-input">
            </div>

            <div>
                <label for="full-name">Full name:</label>
                <input type="text" id="name-input">
            </div>

            <div>
                <label for="email-input">Email:</label>
                <input type="text" id="email-input">
            </div>

            <div>
                 <label for="password-input">Password:</label>
                 <input type="text" id="password-input">
            </div>
        </div>
        <div class="button-div">
            <button id="user-submit-modal" class="submit-modal">Register User</button>
        </div>
 
    </dialog>

    <dialog id="property-modal">
        <div id="property-close-modal" class="close-modal">X</div>
        <h1>Admin Panel: Add Property</h1>
        <h2>Use this form to add a new property in the system.</h2>
        <div class="input-div">
            <div>
                <label for="property-name">Property name:</label>
                <input type="text" id="property-name">
            </div>

            <div>
                <label for="property-address">Address:</label>
                <input type="text" id="property-address">
            </div>

            <div>
                <label for="property-type">Type:</label>
                <input type="text" id="property-type">
            </div>

            <div>
                 <label for="">Priority</label>
                 <select name="" id="priority">
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                 </select>
            </div>
        </div>
        <div class="button-div">
            <button id="property-submit-modal" class="submit-modal">Add property</button>
        </div>
 
    </dialog>

    <dialog id="tickets-modal">
        <div id="tickets-close-modal" class="close-modal">X</div>
        <h1>Admin Panel: Add Ticket</h1>
        <h2>Use this form to add new tickets</h2>
        <div class="input-div">
            <div>
              <label for="">Subject:</label>
              <input type="text" id="ticket-subject">
            </div>

            <div>
              <label for="">Description:</label>
              <input type="text" id="ticket-description">
            </div>

            <div>
              <label for="">Priority:</label>
              <select name="" id="ticket-priority">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
            </div>

            <div>
              <label for="">Status:</label>
              <select name="" id="ticket-status">
                <option value="solved">Solved</option>
                <option value="unsolved">Unsolved</option>
              </select>
            </div>
        </div>
        <div class="button-div">
            <button id="tickets-submit-modal" class="submit-modal">Add Request</button>
        </div>
    </dialog>

    <dialog id="edit-modal">
        <div id="edit-close-modal" class="close-modal">X</div>
        <h1>Edit Ticket</h1>
        <h2>Use this form to edit the ticket</h2>
        <div class="input-div">
            <div>
              <label for="">Subject:</label>
              <input type="text" id="edit-ticket-subject">
            </div>

            <div>
              <label for="">Description:</label>
              <input type="text" id="edit-ticket-description">
            </div>

            <div>
              <label for="">Priority:</label>
              <select name="" id="edit-ticket-priority">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
            </div>

            <div>
              <label for="">Status:</label>
              <select name="" id="edit-ticket-status">
                <option value="solved">Solved</option>
                <option value="unsolved">Unsolved</option>
              </select>
            </div>
        </div>
        <div class="button-div">
            <button id="edit-submit-modal" class="submit-modal">Edit Request</button>
            <button id="delete-request-btn" class="submit-modal delete-btn">Delete Button</button>
        </div>
 
    </dialog>
  </div>
  <div id="popupContainer"></div>
  
</body>
</html>
